name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.9"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: music_app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run build_runner and gen-l10n locally and commit the result." >&2
            git status --porcelain >&2
            git diff >&2
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Check coverage
        run: ./scripts/check_coverage.sh coverage/lcov.info 97

      # Reporting only: check_coverage.sh above is what fails the build. Forks
      # cannot read the token, so an upload failure must not fail the job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: app
          name: music_app
          fail_ci_if_error: false

  build_apk:
    name: Build APK
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: music_app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  integration:
    name: Integration tests
    needs: app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Generate localizations
        run: flutter gen-l10n

      # A cold Android build downloads SDK platform 33 (pinned by metadata_god
      # and on_audio_query_android), installs CMake, and compiles the native
      # sources of jni and audiotags. That alone outruns the per-suite timeout
      # below, so it happens here rather than inside the emulator session.
      - name: Warm the Android build
        run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            timeout 480 flutter test integration_test/app_flows_test.dart -d emulator-5554
            timeout 480 flutter test integration_test/user_flows_test.dart -d emulator-5554
            timeout 480 flutter test integration_test/backup_flows_test.dart -d emulator-5554

  app_ui:
    name: packages/app_ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/app_ui
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Check coverage
        run: ../../scripts/check_coverage.sh coverage/lcov.info 98

      # lcov paths are relative to the package root; Codecov matches them
      # against the repository, so they need the package prefix.
      - name: Rewrite coverage paths to be repository-relative
        run: sed -i 's|^SF:|SF:packages/app_ui/|' coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/app_ui/coverage/lcov.info
          flags: app_ui
          name: app_ui
          fail_ci_if_error: false
