name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Called by release_please.yml, whose tag cannot start this workflow on its
  # own: GitHub does not trigger a run from a push made with GITHUB_TOKEN.
  workflow_call:
    inputs:
      tag:
        description: "The tag to build and publish."
        required: true
        type: string

env:
  FLUTTER_VERSION: "3.44.9"
  # Kept in step with compileSdk in android/app/build.gradle.kts,
  # which permission_handler_android pins to 37.
  ANDROID_COMPILE_SDK: "37"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Check coverage
        run: ./scripts/check_coverage.sh coverage/lcov.info 97

      - name: Install the Android SDK platform the build targets
        run: |
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-${{ env.ANDROID_COMPILE_SDK }}"

      # NOTE: android/app/build.gradle.kts signs the release build with the
      # debug keystore intentionally — no production signing for this app.
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/music_app-$TAG.apk"

      # release-please publishes the release itself, notes included, so the
      # APK is attached to what already exists. A tag pushed by hand has no
      # release yet, and gets one here.
      - name: Publish the APK
        run: |
          asset="release/music_app-$TAG.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
