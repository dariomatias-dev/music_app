name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  FLUTTER_VERSION: "3.44.9"
  # Kept in step with compileSdk in android/app/build.gradle.kts,
  # which permission_handler_android pins to 37.
  ANDROID_COMPILE_SDK: "37"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Install the Android SDK platform the build targets
        run: |
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-${{ env.ANDROID_COMPILE_SDK }}"

      # WARNING: android/app/build.gradle.kts still signs the release build with
      # the debug keystore. Wire a real keystore (secrets + key.properties) before
      # pushing the first v*.*.* tag: a debug-signed APK can't be trusted, and
      # switching keys later breaks in-place upgrades.
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/music_app-${{ github.ref_name }}.apk"

      - name: Create GitHub release
        run: |
          gh release create "${{ github.ref_name }}" \
            "release/music_app-${{ github.ref_name }}.apk" \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
