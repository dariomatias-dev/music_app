name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  app:
    name: music_app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run build_runner and gen-l10n locally and commit the result." >&2
            git status --porcelain >&2
            git diff >&2
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  app_ui:
    name: packages/app_ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app_ui
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
