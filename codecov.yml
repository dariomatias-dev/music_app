# Codecov configuration.
#
# Coverage is uploaded as two independent flags, one per package, because the
# two suites run as separate CI jobs and carry different thresholds. The
# targets mirror scripts/check_coverage.sh, which stays the authority: Codecov
# reports and annotates, the script is what actually fails the build.

codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "90...100"
  status:
    project:
      # Disabled in favour of the two per-flag statuses below.
      default: false
      app:
        flags: [app]
        target: 97%
        threshold: 0.5%
      app_ui:
        flags: [app_ui]
        target: 98%
        threshold: 0.5%
    patch:
      default:
        target: auto
        threshold: 0.5%

# Mirrors the exclusions in scripts/check_coverage.sh: generated sources mirror
# hand-written declarations, and counting them drags the number away from the
# code a test could actually cover.
ignore:
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "lib/l10n/**"
  - "lib/src/core/database/tables/**"

flags:
  app:
    paths:
      - lib/
    carryforward: true
  app_ui:
    paths:
      - packages/app_ui/lib/
    carryforward: true

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true

github_checks:
  annotations: true
