name: music_app
description: "Music App: offline local music player."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  app_ui:
    path: packages/app_ui

  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Navigation
  go_router: ^17.4.0

  # Audio playback
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # Local media access
  on_audio_query: ^2.9.0
  permission_handler: ^13.0.0
  file_picker: ^11.0.3
  metadata_god: ^1.1.0

  # Persistence
  shared_preferences: ^2.5.5
  # Pinned: drift >=2.32.0 requires analyzer ^10-13, incompatible with
  # riverpod_generator (analyzer ^7-9).
  drift: 2.31.0
  sqlite3: ^2.4.6
  # Pinned: 0.6.0 is EOL ("update to sqlite3 3.x instead"), which the pin
  # above on sqlite3 2.x can't use. Bundles the native SQLite binaries that
  # sqlite3 2.x still relies on for Android/iOS.
  sqlite3_flutter_libs: 0.5.42
  path_provider: ^2.1.6
  path: ^1.9.1

  # Internationalization
  # Pinned: version forced by flutter_localizations from the Flutter SDK.
  intl: 0.20.2

  # Identifiers
  uuid: ^4.6.0

  # Immutable models (used only where it meaningfully reduces manual code)
  freezed_annotation: ^3.1.0
  # Required directly: generated fromJson/toJson code references its types.
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.5.4
  riverpod_generator: ^3.0.0
  json_serializable: ^6.9.5
  freezed: ^3.2.3
  go_router_builder: ^4.4.0
  # Pinned: must match the drift version above.
  drift_dev: 2.31.0

  # Testing
  mocktail: ^1.0.5
  # For faking FilePickerPlatform.instance in widget tests.
  plugin_platform_interface: ^2.1.8

  # Quality
  very_good_analysis: ^10.3.0

# metadata_god 1.1.0 was code-generated against flutter_rust_bridge 2.11.1;
# its unconstrained `^2.11.1` dependency otherwise resolves to newer
# releases, which fail its own codegen/runtime version check at startup.
dependency_overrides:
  flutter_rust_bridge: 2.11.1

flutter:
  uses-material-design: true
  generate: true
